<link rel="icon" type="image/png" sizes="64x64" href="assets/favicon-64.png">

<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  --bg:#F4F2EE; --surface:#FFFFFF; --soft:#EFECE6; --ink:#14161A; --ink2:#3B3F46; --muted:#6B7079;
  --line:rgba(20,22,26,.09); --accent:#B86A12; --accent-hi:#F2A541;
  --solid:#14161A; --solid-ink:#FFFFFF; --bar:rgba(244,242,238,.82);
  --shadow:0 1px 2px rgba(20,22,26,.04),0 6px 20px -8px rgba(20,22,26,.08);
  --shadow-lg:0 2px 6px rgba(20,22,26,.05),0 24px 48px -16px rgba(20,22,26,.22);
  --scrim:rgba(10,11,14,.55); --hero:#0B0D12;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0B0C0F; --surface:#15171C; --soft:#1D2027; --ink:#ECEDEF; --ink2:#C6C9CF; --muted:#8D929C;
    --line:rgba(255,255,255,.08); --accent:#F2A541;
    --solid:#F2F3F5; --solid-ink:#0B0C0F; --bar:rgba(11,12,15,.78);
    --shadow:0 1px 2px rgba(0,0,0,.3);
    --shadow-lg:0 24px 48px -16px rgba(0,0,0,.7); --scrim:rgba(0,0,0,.7); --hero:#08090C;
    color-scheme:dark;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  overflow-x:hidden;
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Noto Sans",sans-serif;
  background:var(--bg); color:var(--ink); line-height:1.5; -webkit-text-size-adjust:100%;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale; min-height:100vh;
}
/* hidden until the chosen language is loaded (max ~1.5s, see script) */
html.i18n-wait body{opacity:0}
body{transition:opacity .2s ease}
/* scripts that break with letter-spacing (cursive / complex shaping) */
:lang(ar) *, :lang(fa) *, :lang(my) *, :lang(th) *, :lang(lo) *, :lang(hi) *, :lang(bn) *, :lang(ta) *, :lang(te) *, :lang(am) *{letter-spacing:0!important}
:lang(ar) .eyebrow, :lang(fa) .eyebrow{text-transform:none}
/* tall scripts need a little more line height */
:lang(my) body, :lang(th) body, :lang(lo) body, :lang(ta) body, :lang(te) body, :lang(bn) body, :lang(hi) body{line-height:1.65}
:lang(my) .hero h1, :lang(th) .hero h1, :lang(lo) .hero h1, :lang(ta) .hero h1, :lang(te) .hero h1, :lang(bn) .hero h1, :lang(hi) .hero h1{line-height:1.4}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent-hi);outline-offset:3px;border-radius:12px}

/* ---------- top bar ---------- */
.top{
  position:fixed;top:0;left:0;right:0;z-index:20;color:#fff;padding-top:env(safe-area-inset-top);
  transition:background-color .3s ease,color .3s ease,box-shadow .3s ease;
}
.top.scrolled{
  color:var(--ink);background:var(--bar);box-shadow:0 1px 0 var(--line);
  -webkit-backdrop-filter:saturate(1.8) blur(16px);backdrop-filter:saturate(1.8) blur(16px);
}
.top-in{max-width:1080px;margin:0 auto;height:60px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px;font-weight:800;font-size:16px;letter-spacing:-.01em}
.logo{
  width:32px;height:32px;border-radius:50%;flex:0 0 auto;object-fit:cover;background:#2A2D33;
  box-shadow:0 0 0 2px rgba(242,165,65,.85),0 6px 14px -6px rgba(221,106,44,.8);
}
.lang{position:relative;display:flex;align-items:center}
.lang svg{position:absolute;pointer-events:none;opacity:.85}
.lang .globe{inset-inline-start:12px}
.lang .chev{inset-inline-end:12px}
.lang select{
  appearance:none;-webkit-appearance:none;cursor:pointer;color:inherit;
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);border-radius:999px;
  padding:7px 32px 7px 34px;font-size:13px;font-weight:700;min-height:38px;max-width:min(52vw,220px);
  transition:background-color .2s ease,border-color .2s ease;
}
.lang select:hover{background-color:rgba(255,255,255,.14)}
.top.scrolled .lang select{background-color:var(--surface);border-color:var(--line)}
.top.scrolled .lang select:hover{background-color:var(--soft)}
.lang select option{color:#14161A;background:#fff}

/* ---------- hero ---------- */
.hero{
  position:relative;overflow:hidden;isolation:isolate;background:var(--hero);color:#fff;text-align:center;
  padding:calc(118px + env(safe-area-inset-top)) 20px 72px;border-radius:0 0 32px 32px;
}
.hero:before{
  content:"";position:absolute;inset:0;z-index:-1;
  background:
    radial-gradient(55% 50% at 15% 5%,rgba(242,165,65,.30),transparent 70%),
    radial-gradient(50% 55% at 92% 28%,rgba(25,160,168,.24),transparent 70%),
    radial-gradient(70% 55% at 50% 118%,rgba(221,106,44,.24),transparent 70%);
}
.hero:after{
  content:"";position:absolute;inset:0;z-index:-1;
  background-image:linear-gradient(rgba(255,255,255,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.045) 1px,transparent 1px);
  background-size:44px 44px;background-position:center top;
  -webkit-mask-image:radial-gradient(ellipse 65% 60% at 50% 38%,#000 15%,transparent 72%);
          mask-image:radial-gradient(ellipse 65% 60% at 50% 38%,#000 15%,transparent 72%);
}
.hero-in{max-width:720px;margin:0 auto}
html:not(.i18n-wait) .hero-in > *{animation:rise .9s cubic-bezier(.2,.8,.2,1) backwards}
html:not(.i18n-wait) .hero-in > :nth-child(2){animation-delay:.06s}
html:not(.i18n-wait) .hero-in > :nth-child(3){animation-delay:.12s}
html:not(.i18n-wait) .hero-in > :nth-child(4){animation-delay:.18s}
html:not(.i18n-wait) .hero-in > :nth-child(5){animation-delay:.24s}
html:not(.i18n-wait) .hero-in > :nth-child(6){animation-delay:.30s}
@keyframes rise{from{opacity:0;transform:translateY(18px)}}

.hero-icons{display:flex;justify-content:center;margin:0 0 28px;padding-inline-start:10px}
.hero-icons button{
  position:relative;width:48px;height:48px;padding:0;border:0;border-radius:14px;background:none;cursor:pointer;
  margin-inline-start:-10px;box-shadow:0 0 0 3px var(--hero),0 10px 24px -8px rgba(0,0,0,.8);
  transition:transform .35s cubic-bezier(.2,.8,.2,1);
}
.hero-icons button:nth-child(odd){transform:rotate(-6deg)}
.hero-icons button:nth-child(even){transform:rotate(5deg) translateY(3px)}
.hero-icons button:hover,.hero-icons button:focus-visible{transform:translateY(-6px) scale(1.08);z-index:2}
.hero-icons img{width:100%;height:100%;border-radius:14px;object-fit:cover}
.eyebrow{
  display:inline-flex;align-items:center;gap:12px;margin:0 0 14px;
  font-size:11.5px;font-weight:700;letter-spacing:.34em;text-transform:uppercase;color:var(--accent-hi);
}
.eyebrow:before,.eyebrow:after{content:"";width:22px;height:1px;background:currentColor;opacity:.5}
.hero h1{
  margin:0;font-size:clamp(38px,8.6vw,62px);font-weight:800;letter-spacing:-.035em;line-height:1.1;padding-bottom:.04em;
  background:linear-gradient(180deg,#FFFFFF 35%,#B8BDC7);-webkit-background-clip:text;background-clip:text;color:transparent;
  text-wrap:balance;
}
.hero .sub{margin:18px auto 0;max-width:520px;font-size:clamp(14.5px,2.2vw,16.5px);line-height:1.7;color:rgba(255,255,255,.66);text-wrap:pretty}
.stats{
  display:grid;width:fit-content;max-width:100%;grid-template-columns:repeat(3,auto);margin:32px auto 0;padding:14px 4px;list-style:none;
  background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.1);border-radius:18px;
  -webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);
}
.stats li{display:flex;flex-direction:column;align-items:center;gap:4px;padding:2px 22px;min-width:64px}
.stats li+li{border-inline-start:1px solid rgba(255,255,255,.12)}
.stats span{font-size:11.5px;color:rgba(255,255,255,.55);letter-spacing:.02em}
.stats b{font-size:20px;line-height:1.2;font-weight:800;letter-spacing:-.01em;text-align:center}
.hero .cta{
  display:inline-flex;align-items:center;gap:8px;margin-top:28px;
  background:#fff;color:#0B0D12;font-weight:800;font-size:14px;border-radius:999px;padding:13px 22px;
  box-shadow:0 12px 32px -12px rgba(242,165,65,.7);transition:transform .25s ease,box-shadow .25s ease;
}
.hero .cta:hover{transform:translateY(-2px);box-shadow:0 18px 40px -12px rgba(242,165,65,.85)}
.hero .cta svg{color:#DD6A2C}
@media (prefers-color-scheme: dark){.hero{box-shadow:inset 0 -1px 0 rgba(255,255,255,.07)}}

/* ---------- layout ---------- */
.wrap{max-width:1080px;margin:0 auto;padding:56px 20px 40px}
.sec-h{display:flex;align-items:flex-end;justify-content:space-between;gap:6px 12px;margin:0 2px 20px;flex-wrap:wrap}
.sec-h h2{margin:0;display:flex;align-items:center;gap:10px;font-size:clamp(22px,4vw,28px);font-weight:800;letter-spacing:-.025em;line-height:1.2}
.sec-h h2 .n{font-size:12px;font-weight:800;letter-spacing:0;color:var(--muted);background:var(--soft);border-radius:999px;padding:3px 10px}
.sec-h p{margin:0 0 3px;font-size:13px;color:var(--muted)}

/* ---------- app cards ---------- */
.apps{display:grid;grid-template-columns:minmax(0,1fr);gap:18px}
@media(min-width:760px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:1040px){.apps{grid-template-columns:repeat(3,minmax(0,1fr))}}
.app{
  --tint:#888;position:relative;min-width:0;display:flex;flex-direction:column;gap:16px;
  background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:var(--shadow);
  transition:transform .4s cubic-bezier(.2,.8,.2,1),box-shadow .4s ease,border-color .4s ease;
}
@media(hover:hover){
  .app:hover{transform:translateY(-4px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--tint) 45%,var(--line))}
  .app:hover .row img{transform:translateY(-6px)}
}
.app-top{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.app-icon{
  flex:0 0 auto;width:60px;height:60px;border-radius:16px;background:var(--soft);object-fit:cover;
  box-shadow:0 0 0 1px var(--line),0 8px 18px -8px color-mix(in srgb,var(--tint) 80%,transparent);
}
.app-meta{flex:1;min-width:0}
.app-name{margin:0;font-size:17px;font-weight:800;line-height:1.3;letter-spacing:-.015em}
.app-tag{margin:5px 0 0;font-size:13.5px;line-height:1.5;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:700;color:var(--ink2);background:var(--soft);border-radius:999px;padding:4px 10px;white-space:nowrap}
.chip.cat:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--tint)}
.peek{
  margin-top:auto;position:relative;height:164px;overflow:hidden;cursor:pointer;border-radius:18px;padding:16px 16px 0;
  background:var(--soft);
  background:linear-gradient(160deg,color-mix(in srgb,var(--tint) 22%,var(--surface)),color-mix(in srgb,var(--tint) 6%,var(--surface)));
}
.row{
  display:flex;gap:10px;height:100%;
  -webkit-mask-image:linear-gradient(90deg,#000 72%,transparent 98%);mask-image:linear-gradient(90deg,#000 72%,transparent 98%);
}
[dir=rtl] .row{-webkit-mask-image:linear-gradient(270deg,#000 72%,transparent 98%);mask-image:linear-gradient(270deg,#000 72%,transparent 98%)}
.row img{
  height:190px;width:auto;flex:0 0 auto;border-radius:11px;background:var(--surface);
  box-shadow:0 10px 22px -10px rgba(0,0,0,.45);transition:transform .45s cubic-bezier(.2,.8,.2,1);
}
.row img:nth-child(2){transition-delay:.04s}.row img:nth-child(3){transition-delay:.08s}.row img:nth-child(4){transition-delay:.12s}
.actions{display:flex;gap:10px}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:8px;cursor:pointer;
  border-radius:14px;padding:11px 14px;font-size:14px;font-weight:800;border:1px solid transparent;min-height:46px;
  transition:background-color .2s ease,opacity .2s ease,transform .12s ease;
}
.btn:active{transform:scale(.98)}
.btn-2{background:transparent;border-color:var(--line);color:var(--ink)}
.btn-2:hover{background:var(--soft)}
.btn-1{background:var(--solid);color:var(--solid-ink)}
.btn-1:hover{opacity:.88}
.btn svg{flex:0 0 auto}

/* entrance */
.rv:not(.in){opacity:0}
.rv.in{animation:rise .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) backwards}

/* ---------- web projects ---------- */
.web{margin-top:72px}
.webs{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media(min-width:760px){.webs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.proj{
  --tint:#888;display:flex;align-items:center;gap:14px;background:var(--surface);border:1px solid var(--line);
  border-radius:20px;padding:14px 16px;box-shadow:var(--shadow);transition:border-color .3s ease,transform .3s ease,box-shadow .3s ease;
}
@media(hover:hover){.proj:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:color-mix(in srgb,var(--tint) 45%,var(--line))}}
.proj .ic{flex:0 0 auto;width:46px;height:46px;border-radius:14px;display:grid;place-items:center;font-size:22px;background:var(--soft);background:color-mix(in srgb,var(--tint) 18%,var(--surface))}
.proj .pc{flex:1;min-width:0}
.proj .nm{display:block;font-size:14.5px;font-weight:800;line-height:1.3;letter-spacing:-.01em}
.proj .ds{display:block;font-size:12.5px;color:var(--muted);margin-top:3px}
.proj .arr{flex:0 0 auto;width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--soft);color:var(--ink2);font-size:14px;font-weight:800;transition:transform .3s ease}
@media(hover:hover){.proj:hover .arr{transform:rotate(45deg)}}
[dir=rtl] .proj .arr{transform:scaleX(-1)}

/* ---------- footer ---------- */
.foot{margin-top:72px;padding-top:24px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}
.foot .brand{font-size:14px;color:var(--ink)}
.foot .logo{width:26px;height:26px}
.foot a.gh{font-weight:700;color:var(--ink2)}
.foot a.gh:hover{color:var(--accent)}

/* ---------- detail sheet ---------- */
dialog{border:0;padding:0;color:var(--ink);background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:var(--scrim);-webkit-backdrop-filter:blur(6px);backdrop-filter:blur(6px)}
.sheet{
  --tint:#888;width:min(100vw,640px);max-width:100vw;margin:auto auto 0;height:auto;overflow-x:hidden;
  background:var(--surface);border-radius:28px 28px 0 0;box-shadow:var(--shadow-lg);
  max-height:92dvh;overflow:auto;overscroll-behavior:contain;
}
.sheet[open]{animation:up .32s cubic-bezier(.2,.8,.2,1)}
@media(min-width:760px){
  .sheet{margin:auto;border-radius:28px;max-height:88dvh}
  .sheet[open]{animation:pop .25s cubic-bezier(.2,.8,.2,1)}
}
@keyframes up{from{transform:translateY(48px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.96) translateY(8px);opacity:0}to{transform:none;opacity:1}}
.sh-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0}
@media(min-width:760px){.sh-grip{display:none}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--surface);display:flex;gap:14px;align-items:center;padding:16px 20px 12px;border-bottom:1px solid transparent;transition:border-color .2s ease}
.sh-head.stuck{border-bottom-color:var(--line)}
.sh-head .app-icon{width:58px;height:58px;border-radius:15px}
.sh-head h3{margin:0;font-size:18.5px;font-weight:800;line-height:1.25;letter-spacing:-.015em}
.sh-head .dev{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--accent);font-weight:700;margin-top:3px}
.sh-head .dev img{width:16px;height:16px;border-radius:50%;object-fit:cover}
.x{
  margin-inline-start:auto;flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:var(--soft);color:var(--ink);display:grid;place-items:center;transition:transform .2s ease;
}
.x:hover{transform:rotate(90deg)}
.sh-body{min-width:0;padding:6px 20px calc(20px + env(safe-area-inset-bottom))}
.sh-body .lead{font-size:15.5px;line-height:1.65;margin:0 0 16px;color:var(--ink2)}
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:4px 20px 12px;margin:0 -20px;scrollbar-width:thin}
.shots button{flex:0 0 auto;padding:0;border:0;background:none;cursor:zoom-in;scroll-snap-align:start;border-radius:14px}
.shots img{height:min(52dvh,380px);width:auto;border-radius:14px;background:var(--soft);box-shadow:0 0 0 1px var(--line)}
.sh-body h4{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);margin:22px 0 10px}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feats li{display:flex;gap:12px;align-items:flex-start;font-size:14px;line-height:1.55;background:var(--soft);border-radius:14px;padding:12px 14px}
.feats li .em{flex:0 0 auto;font-size:17px;line-height:1.3}
.sh-foot{position:sticky;bottom:0;background:var(--surface);padding:12px 20px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sh-foot .btn{font-size:15px;min-height:50px}

/* ---------- lightbox ---------- */
.lb{width:100vw;height:100dvh;margin:0;background:rgba(0,0,0,.94)}
.lb::backdrop{background:rgba(0,0,0,.94)}
.lb-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;padding:56px 12px 40px}
.lb-track img{max-width:100%;max-height:100%;border-radius:14px;object-fit:contain}
.lb .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(255,255,255,.14);color:#fff;z-index:2}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:none;place-items:center;z-index:2}
@media(hover:hover){.lb-nav{display:grid}}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-count{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:13px}

@media (max-width:480px){
  .hero{padding-top:calc(100px + env(safe-area-inset-top));padding-bottom:56px;border-radius:0 0 26px 26px}
  .stats li{padding:2px 14px}
  .wrap{padding-top:44px}
}
@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>
<body>

<header class="top" id="top">
  <div class="top-in">
    <div class="brand"><img class="logo" src="assets/logo.webp" alt="" width="32" height="32"><span>Teemy</span></div>

/* =====================================================================

   ===================================================================== */
function langInfo(code){ for (var i=0;i<LANGS.length;i++) if (LANGS[i].code === code) return LANGS[i]; return null; }
function matchLang(tag){
  var full = String(tag || "").toLowerCase().replace("_","-"), base = full.split("-")[0];
  if (langInfo(full)) return full;
  if (ALIASES[base] && langInfo(ALIASES[base])) return ALIASES[base];
  if (langInfo(base)) return base;
  return null;
}
function pickLang(){
  try { var s = localStorage.getItem(LS_KEY); if (s && langInfo(s)) return s; } catch(e){}
  var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  for (var i=0;i<list.length;i++){ var m = matchLang(list[i]); if (m) return m; }
  return DEFAULT_LANG;
}

/* dictionaries: fetched once, cached */

function loadDict(code){
  if (DICT[code]) return Promise.resolve(DICT[code]);
  return fetch("i18n/" + code + ".json", {cache:"no-cache"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ DICT[code] = d; return d; });
}

function dig(o, path){ for (var i=0;i<path.length && o != null;i++) o = o[path[i]]; return o; }
function get(path){

  if (v == null || v === "") v = dig(DICT[DEFAULT_LANG], p);
  return v == null ? "" : v;
}

/* fade cards in as they scroll into view (first render only) */
var revealed = false;
function observeReveal(){
  var els = document.querySelectorAll(".rv");
  if (revealed || !els.length) return;
  revealed = true;
  if (!("IntersectionObserver" in window)) { els.forEach(function(el){ el.classList.add("in"); }); return; }
  var io = new IntersectionObserver(function(list){
    list.forEach(function(e){ if (e.isIntersecting) { e.target.classList.add("in"); io.unobserve(e.target); } });
  }, {rootMargin:"0px 0px -40px 0px"});
  els.forEach(function(el){ io.observe(el); });
}

}

function renderAll(){
  renderStatic(); renderLangSelect(); renderApps(); renderWeb();
  if (current >= 0) fillSheet(current);
  document.documentElement.classList.remove("i18n-wait");
}

/* =====================================================================
   detail sheet
   ===================================================================== */
var sheet = $("sheet"), current = -1;

function fillSheet(i){
  var a = APPS[i], feats = get("apps." + a.key + ".feats") || [];
  sheet.style.setProperty("--tint", a.tint);
  sheet.innerHTML =
    '<div class="sh-grip" aria-hidden="true"></div>' +
    '<div class="sh-head" id="shHead">' +
      '<img class="app-icon" src="' + img(a.icon,"s128") + '" alt="" width="56" height="56">' +
      '<div><h3 id="sh-title">' + esc(appName(a)) + '</h3><div class="dev"><img src="assets/logo.webp" alt="" width="16" height="16">Teemy</div><div class="chips">' + chipsHtml(a) + '</div></div>' +
      '<button class="x" type="button" id="shClose" aria-label="' + esc(t("close")) + '">' + ICON_X + '</button>' +
    '</div>' +
    '<div class="sh-body">' +
      '<p class="lead">' + esc(get("apps." + a.key + ".lead")) + '</p>' +
      '<div class="shots">' + a.shots.map(function(s, k){
        return '<button type="button" data-shot="' + k + '"><img src="' + img(s,"h760") + '" alt="' + esc(appName(a) + " " + (k+1)) + '" loading="lazy"></button>';
      }).join("") + '</div>' +
      '<h4>' + esc(t("highlights")) + '</h4>' +
      '<ul class="feats">' + feats.map(function(f, k){
        return '<li><span class="em" aria-hidden="true">' + (a.em[k] || "•") + '</span><span>' + esc(f) + '</span></li>';
      }).join("") + '</ul>' +
    '</div>' +
    '<div class="sh-foot"><a class="btn btn-1" href="' + playUrl(a) + '" target="_blank" rel="noopener">' + ICON_PLAY + esc(t("open")) + '</a></div>';
  $("shClose").onclick = function(){ sheet.close(); };
  sheet.onscroll = function(){ $("shHead").classList.toggle("stuck", sheet.scrollTop > 4); };
}

function openSheet(i, fromHash){
  current = i;
  fillSheet(i);
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (!fromHash && location.hash !== "#" + APPS[i].key) history.pushState({sheet:1}, "", "#" + APPS[i].key);
}
sheet.addEventListener("close", function(){
  current = -1;
  document.body.style.overflow = "";
  if (location.hash) {
    if (history.state && history.state.sheet) history.back();
    else history.replaceState(null, "", location.pathname + location.search);
  }
});
sheet.addEventListener("click", function(e){
  if (e.target === sheet) { sheet.close(); return; }   // backdrop tap
  var b = e.target.closest("[data-shot]");
  if (b) openLightbox(+b.getAttribute("data-shot"));
});
window.addEventListener("popstate", function(){
  if (lb.open) lb.close();
  var i = indexFromHash();
  if (i < 0 && sheet.open) sheet.close();
  else if (i >= 0 && !sheet.open) openSheet(i, true);
});
function indexFromHash(){
  var k = location.hash.replace("#","");
  for (var i=0;i<APPS.length;i++) if (APPS[i].key === k) return i;
  return -1;
}

document.addEventListener("click", function(e){
  var d = e.target.closest("[data-detail]");
  if (d) openSheet(+d.getAttribute("data-detail"));
});

/* =====================================================================
   lightbox
   ===================================================================== */
var lb = $("lb"), track = $("lbTrack");
function openLightbox(k){
  var a = APPS[current];
  track.innerHTML = a.shots.map(function(s, n){
    return '<figure><img src="' + img(s,"h1600") + '" alt="' + esc(appName(a) + " " + (n+1)) + '"></figure>';
  }).join("");
  lb.showModal();
  track.scrollLeft = k * track.clientWidth;
  updateCount();
}
function updateCount(){
  var n = APPS[current] ? APPS[current].shots.length : 0;
  var k = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  $("lbCount").textContent = n ? (k+1) + " / " + n : "";
}
function step(d){ track.scrollBy({left: d * track.clientWidth, behavior:"smooth"}); }
track.addEventListener("scroll", updateCount, {passive:true});
$("lbClose").onclick = function(){ lb.close(); };
$("lbPrev").onclick = function(){ step(-1); };
$("lbNext").onclick = function(){ step(1); };
lb.addEventListener("click", function(e){ if (e.target.tagName === "FIGURE") lb.close(); });
lb.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});

/* =====================================================================
   boot
   ===================================================================== */
function setLang(code){
  return Promise.all([loadDict(DEFAULT_LANG), code === DEFAULT_LANG ? null : loadDict(code).catch(function(){ return null; })])
    .then(function(r){ lang = (code === DEFAULT_LANG || r[1]) ? code : DEFAULT_LANG; renderAll(); });
}
$("lang").addEventListener("change", function(){
  var code = this.value;
  try { localStorage.setItem(LS_KEY, code); } catch(e){}
  setLang(code);
});
var topBar = $("top");
function onScroll(){ topBar.classList.toggle("scrolled", window.scrollY > 24); }
window.addEventListener("scroll", onScroll, {passive:true});
onScroll();

/* never keep the page hidden for long, even on a slow network */
setTimeout(function(){ document.documentElement.classList.remove("i18n-wait"); }, 1500);
setLang(lang).then(function(){
  var startIdx = indexFromHash();
  if (startIdx >= 0) openSheet(startIdx, true);
});
</script>
</body>
</html>
