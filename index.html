<title>Teemy · Android Apps by hwancole</title>
<meta name="description" content="Android apps by Teemy: Familtory, Blinker, Romantic Candle, Night Fireplace, MorseRun and Homemo. Free to download on Google Play.">
<meta name="theme-color" content="#0E3A4F">
<meta property="og:title" content="Teemy · Android Apps">
<meta property="og:description" content="Practical Android apps for everyday use. Free to download on Google Play.">

<link rel="preconnect" href="https://play-lh.googleusercontent.com">
<style>
:root{
  --navy:#0E3A4F; --navy2:#0E4D64; --teal:#0E7C86; --tealb:#19A0A8;
  --paper:#F4F7F8; --card:#FFFFFF; --ink:#16252B; --muted:#5E7681; --line:#DCE6E9;
  --chip:#EAF3F4; --chip-ink:#0E6670; --shadow:0 1px 3px rgba(14,58,79,.06);
  --shadow-lg:0 10px 30px rgba(14,58,79,.14); --scrim:rgba(8,24,32,.55);
  --btn2:#EEF4F5; --btn2-ink:#0E4D64;
}
@media (prefers-color-scheme: dark){
  :root{
    --paper:#0B161B; --card:#13232A; --ink:#E6EFF1; --muted:#93AAB3; --line:#21363F;
    --chip:#173039; --chip-ink:#7FD3DA; --shadow:0 1px 3px rgba(0,0,0,.3);
    --shadow-lg:0 10px 30px rgba(0,0,0,.45); --scrim:rgba(0,0,0,.65);
    --btn2:#1B323B; --btn2-ink:#BFE3E7; --teal:#4FC3CB;
  }
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
html,body{margin:0}
body{
  overflow-x:hidden;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Apple SD Gothic Neo","Pretendard","Malgun Gothic","Noto Sans KR",system-ui,"Noto Sans",sans-serif;
  background:var(--paper); color:var(--ink); line-height:1.5; -webkit-text-size-adjust:100%;
  min-height:100vh;
}
/* hidden until the chosen language is loaded (max ~1.5s, see script) */
html.i18n-wait body{opacity:0}
body{transition:opacity .15s ease}
/* scripts that break with letter-spacing (cursive / complex shaping) */
:lang(ar) *, :lang(fa) *, :lang(my) *, :lang(th) *, :lang(lo) *, :lang(hi) *, :lang(bn) *, :lang(ta) *, :lang(te) *{letter-spacing:0!important}
:lang(ar) .hero .eyebrow, :lang(fa) .hero .eyebrow{text-transform:none}
/* tall scripts need a little more line height */
:lang(my) body, :lang(th) body, :lang(lo) body, :lang(ta) body, :lang(te) body, :lang(bn) body, :lang(hi) body{line-height:1.65}
a{color:inherit;text-decoration:none}
button{font:inherit;color:inherit}
img{display:block}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- top bar ---------- */
.top{
  position:absolute;top:0;left:0;right:0;z-index:5;
  display:flex;align-items:center;justify-content:space-between;
  padding:calc(12px + env(safe-area-inset-top)) 16px 0;max-width:960px;margin:0 auto;color:#fff;
}
.brand{display:flex;align-items:center;gap:8px;font-weight:800;font-size:15px;letter-spacing:.01em}
.brand .logo{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.16);display:grid;place-items:center;font-size:15px}
.lang{position:relative;display:flex;align-items:center}
.lang svg{position:absolute;inset-inline-start:10px;pointer-events:none;opacity:.9}
.lang select{
  appearance:none;-webkit-appearance:none;cursor:pointer;
  background:rgba(255,255,255,.14) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='10' height='6'><path d='M1 1l4 4 4-4' stroke='white' stroke-width='1.6' fill='none' stroke-linecap='round'/></svg>") no-repeat right 11px center;
  border:1px solid rgba(255,255,255,.28);color:#fff;border-radius:999px;
  padding:7px 30px 7px 32px;font-size:13px;font-weight:700;min-height:36px;max-width:min(52vw,220px);
}
[dir=rtl] .lang select{padding:7px 32px 7px 30px;background-position:left 11px center}
.lang select:hover{background-color:rgba(255,255,255,.22)}
.lang select option{color:#16252B;background:#fff}

/* ---------- hero ---------- */
.hero{
  background:linear-gradient(160deg,#0E3A4F 0%,#0E4D64 55%,#0E7C86 140%);
  color:#fff;padding:calc(78px + env(safe-area-inset-top)) 20px 34px;border-radius:0 0 26px 26px;
  position:relative;overflow:hidden;text-align:center;
}
.hero:after{content:"";position:absolute;right:-60px;top:-60px;width:220px;height:220px;border:2px solid rgba(255,255,255,.12);border-radius:50%}
.hero:before{content:"";position:absolute;left:-40px;bottom:-80px;width:170px;height:170px;border:2px solid rgba(255,255,255,.10);border-radius:50%}
.hero .eyebrow{font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:#BFE3E7;margin:0 0 8px}
.hero h1{margin:0;font-size:clamp(26px,6vw,34px);font-weight:800;letter-spacing:-.01em;line-height:1.2}
.hero .sub{margin:10px auto 0;font-size:14px;color:#D7EAEC;max-width:440px}
.stats{display:flex;justify-content:center;gap:10px;margin:20px 0 0;padding:0;list-style:none;flex-wrap:wrap}
.stats li{background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.18);border-radius:14px;padding:8px 14px;min-width:92px}
.stats b{display:block;font-size:18px;line-height:1.2}
.stats span{font-size:11px;color:#CFE6E9}
.hero .cta{
  position:relative;z-index:1;display:inline-flex;align-items:center;gap:7px;margin-top:20px;
  background:#fff;color:#0E4D64;font-weight:800;font-size:13.5px;border-radius:999px;padding:10px 18px;
  box-shadow:0 4px 14px rgba(0,0,0,.18);
}
.hero .cta:hover{background:#EAF7F8}

/* ---------- layout ---------- */
.wrap{max-width:960px;margin:0 auto;padding:26px 16px 40px}
.sec-h{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin:6px 2px 14px}
.sec-h h2{margin:0;font-size:19px;font-weight:800;letter-spacing:-.01em}
.sec-h p{margin:0;font-size:12.5px;color:var(--muted)}

/* ---------- app cards ---------- */
.apps{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media(min-width:720px){.apps{grid-template-columns:repeat(2,minmax(0,1fr))}}
.app{
  background:var(--card);border:1px solid var(--line);border-radius:20px;padding:16px;
  box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px;min-width:0;
  transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease;
}
@media(hover:hover){.app:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg);border-color:var(--tealb)}}
.app-top{display:flex;gap:14px;align-items:flex-start;cursor:pointer}
.app-icon{flex:0 0 auto;width:64px;height:64px;border-radius:16px;background:var(--chip);object-fit:cover;box-shadow:0 2px 6px rgba(0,0,0,.12)}
.app-meta{flex:1;min-width:0}
.app-name{margin:0;font-size:16.5px;font-weight:800;line-height:1.25}
.app-tag{margin:4px 0 0;font-size:13px;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.chip{font-size:11px;font-weight:700;color:var(--chip-ink);background:var(--chip);border-radius:999px;padding:3px 9px;white-space:nowrap}
.peek{margin-top:auto;display:flex;gap:8px;overflow:hidden;height:118px;border-radius:12px;cursor:pointer;position:relative}
.peek img{height:100%;width:auto;border-radius:10px;background:var(--chip);flex:0 0 auto}
.peek:after{content:"";position:absolute;top:0;bottom:0;inset-inline-end:0;width:60px;background:linear-gradient(90deg,transparent,var(--card))}
[dir=rtl] .peek:after{background:linear-gradient(270deg,transparent,var(--card))}
.actions{display:flex;gap:10px}
.btn{
  flex:1;display:inline-flex;align-items:center;justify-content:center;gap:7px;cursor:pointer;
  border-radius:12px;padding:11px 12px;font-size:14px;font-weight:800;border:0;min-height:44px;
  transition:filter .15s ease, transform .1s ease;
}
.btn:active{transform:scale(.98)}
.btn-2{background:var(--btn2);color:var(--btn2-ink)}
.btn-1{background:var(--navy2);color:#fff}
@media (prefers-color-scheme: dark){.btn-1{background:var(--tealb);color:#04252B}}
.btn:hover{filter:brightness(1.06)}
.btn svg{flex:0 0 auto}
:focus-visible{outline:3px solid var(--tealb);outline-offset:2px;border-radius:10px}

/* ---------- web projects ---------- */
.web{margin-top:44px;padding-top:26px;border-top:1px dashed var(--line)}
.webs{display:grid;grid-template-columns:minmax(0,1fr);gap:10px}
@media(min-width:720px){.webs{grid-template-columns:repeat(3,minmax(0,1fr))}}
.proj{
  display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);
  border-radius:16px;padding:12px 14px;box-shadow:var(--shadow);transition:border-color .18s ease, transform .18s ease;
}
@media(hover:hover){.proj:hover{border-color:var(--tealb);transform:translateY(-1px)}}
.proj .ic{flex:0 0 auto;width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-size:21px}
.proj .pc{flex:1;min-width:0}
.proj .nm{display:block;font-size:14px;font-weight:800;line-height:1.3}
.proj .ds{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.proj .arr{color:var(--teal);font-weight:800}

.foot{text-align:center;font-size:12px;color:var(--muted);margin:40px 0 0;line-height:1.8}
.foot a{color:var(--teal);font-weight:700}

/* ---------- detail sheet ---------- */
dialog{border:0;padding:0;color:var(--ink);background:transparent;max-width:none;max-height:none}
dialog::backdrop{background:var(--scrim);backdrop-filter:blur(2px)}
.sheet{
  width:min(100vw,640px);max-width:100vw;margin:auto auto 0;height:auto;overflow-x:hidden;
  background:var(--card);border-radius:24px 24px 0 0;box-shadow:var(--shadow-lg);
  max-height:92dvh;overflow:auto;overscroll-behavior:contain;
}
.sheet[open]{animation:up .26s cubic-bezier(.2,.8,.2,1)}
@media(min-width:720px){
  .sheet{margin:auto;border-radius:24px;max-height:88dvh}
  .sheet[open]{animation:pop .2s ease}
}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
@keyframes pop{from{transform:scale(.97);opacity:0}to{transform:none;opacity:1}}
.sh-grip{width:40px;height:5px;border-radius:9px;background:var(--line);margin:9px auto 0}
@media(min-width:720px){.sh-grip{display:none}}
.sh-head{position:sticky;top:0;z-index:2;background:var(--card);display:flex;gap:14px;align-items:center;padding:14px 18px 12px;border-bottom:1px solid transparent}
.sh-head.stuck{border-bottom-color:var(--line)}
.sh-head .app-icon{width:56px;height:56px;border-radius:14px}
.sh-head h3{margin:0;font-size:18px;font-weight:800;line-height:1.25}
.sh-head .dev{font-size:12px;color:var(--teal);font-weight:700;margin-top:2px}
.x{
  margin-inline-start:auto;flex:0 0 auto;width:38px;height:38px;border-radius:50%;border:0;cursor:pointer;
  background:var(--btn2);color:var(--btn2-ink);display:grid;place-items:center;
}
.sh-body{min-width:0;padding:4px 18px calc(18px + env(safe-area-inset-bottom))}
.sh-body .lead{font-size:15px;margin:0 0 14px}
.shots{display:flex;gap:10px;overflow-x:auto;scroll-snap-type:x mandatory;padding:2px 2px 10px;margin:0 -18px;padding-left:18px;padding-right:18px;scrollbar-width:thin}
.shots button{flex:0 0 auto;padding:0;border:0;background:none;cursor:zoom-in;scroll-snap-align:start;border-radius:12px}
.shots img{height:min(52dvh,380px);width:auto;border-radius:12px;background:var(--chip);border:1px solid var(--line)}
.sh-body h4{font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:18px 0 8px}
.feats{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.feats li{display:flex;gap:10px;align-items:flex-start;font-size:14px;background:var(--paper);border-radius:12px;padding:10px 12px}
.feats li .em{flex:0 0 auto;font-size:17px;line-height:1.3}
.sh-foot{position:sticky;bottom:0;background:var(--card);padding:12px 18px calc(12px + env(safe-area-inset-bottom));border-top:1px solid var(--line);display:flex;gap:10px}
.sh-foot .btn{font-size:15px}

/* ---------- lightbox ---------- */
.lb{width:100vw;height:100dvh;margin:0;background:rgba(0,0,0,.92)}
.lb::backdrop{background:rgba(0,0,0,.92)}
.lb-track{display:flex;height:100%;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.lb-track::-webkit-scrollbar{display:none}
.lb-track figure{flex:0 0 100%;margin:0;scroll-snap-align:center;display:grid;place-items:center;padding:56px 12px 40px}
.lb-track img{max-width:100%;max-height:100%;border-radius:12px;object-fit:contain}
.lb .x{position:fixed;top:calc(12px + env(safe-area-inset-top));right:12px;background:rgba(255,255,255,.14);color:#fff;z-index:2}
.lb-nav{position:fixed;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(255,255,255,.14);color:#fff;cursor:pointer;display:none;place-items:center;z-index:2}
@media(hover:hover){.lb-nav{display:grid}}
.lb-prev{left:14px}.lb-next{right:14px}
.lb-count{position:fixed;bottom:calc(12px + env(safe-area-inset-bottom));left:0;right:0;text-align:center;color:#ddd;font-size:13px}

@media (prefers-reduced-motion: reduce){
  *,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}
}
</style>
</head>

/* ---- web projects (shown at the bottom). Texts: i18n/*.json → web.<key> ---- */

  { key:"sydney",  href:"https://hwancole.github.io/sydney-trip/",      icon:"🇦🇺", color:"#D7F0F1" },
  { key:"tagalog", href:"https://hwancole.github.io/tagalog-100/",      icon:"🗣️", color:"#DCE8F7" },

];

/* =====================================================================
   language resolution: saved choice → browser languages → English
   ===================================================================== */
function langInfo(code){ for (var i=0;i<LANGS.length;i++) if (LANGS[i].code === code) return LANGS[i]; return null; }
function matchLang(tag){
  var full = String(tag || "").toLowerCase().replace("_","-"), base = full.split("-")[0];
  if (langInfo(full)) return full;
  if (ALIASES[base] && langInfo(ALIASES[base])) return ALIASES[base];
  if (langInfo(base)) return base;
  return null;
}
function pickLang(){
  try { var s = localStorage.getItem(LS_KEY); if (s && langInfo(s)) return s; } catch(e){}
  var list = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language];
  for (var i=0;i<list.length;i++){ var m = matchLang(list[i]); if (m) return m; }
  return DEFAULT_LANG;
}

/* dictionaries: fetched once, cached */
var DICT = {}, lang = pickLang();
function loadDict(code){
  if (DICT[code]) return Promise.resolve(DICT[code]);
  return fetch("i18n/" + code + ".json", {cache:"no-cache"})
    .then(function(r){ if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(function(d){ DICT[code] = d; return d; });
}
/* get("ui.details"), get("apps.familtory.feats.0") — falls back to English */
function dig(o, path){ for (var i=0;i<path.length && o != null;i++) o = o[path[i]]; return o; }
function get(path){
  var p = path.split("."), v = dig(DICT[lang], p);
  if (v == null || v === "") v = dig(DICT[DEFAULT_LANG], p);
  return v == null ? "" : v;
}
function t(k){ return get("ui." + k); }
function esc(s){ return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c];}); }
function hl(){ var i = langInfo(lang); return (i && i.hl) || lang; }
function playUrl(app){ return "https://play.google.com/store/apps/details?id=" + app.id + "&hl=" + hl(); }
function img(id, size){ return IMG + id + "=" + size; }
function appName(a){ return get("apps." + a.key + ".name"); }

var ICON_PLAY = '<svg width="17" height="17" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M5 3.5v17c0 .8.9 1.3 1.6.9l14-8.5c.6-.4.6-1.4 0-1.8l-14-8.5C5.9 2.2 5 2.7 5 3.5z"/></svg>';
var ICON_INFO = '<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M8 9h8M8 13h5"/></svg>';
var ICON_X = '<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>';
var ICON_L = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"/></svg>';
var ICON_R = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M9 5l7 7-7 7"/></svg>';

/* =====================================================================
   render
   ===================================================================== */
var $ = function(id){ return document.getElementById(id); };

function renderStatic(){
  var info = langInfo(lang) || {};
  document.documentElement.lang = info.html || lang;
  document.documentElement.dir = info.rtl ? "rtl" : "ltr";
  document.title = t("docTitle");
  document.querySelectorAll("[data-i]").forEach(function(el){ el.textContent = t(el.getAttribute("data-i")); });
  $("devLink").href = DEV_URL + "&hl=" + hl();
  $("stats").innerHTML =
    '<li><b>' + APPS.length + '</b><span>' + esc(t("statApps")) + '</span></li>' +
    '<li><b dir="ltr">20K+</b><span>' + esc(t("statDl")) + '</span></li>' +
    '<li><b>' + esc(t("statLoginV")) + '</b><span>' + esc(t("statLogin")) + '</span></li>';
  $("yr").textContent = new Date().getFullYear();
  $("lb").setAttribute("aria-label", t("screenshots"));
  $("lbClose").innerHTML = ICON_X; $("lbClose").setAttribute("aria-label", t("close"));
  $("lbPrev").innerHTML = ICON_L; $("lbPrev").setAttribute("aria-label", t("prev"));
  $("lbNext").innerHTML = ICON_R; $("lbNext").setAttribute("aria-label", t("next"));
}

function chipsHtml(a){
  var c = '<span class="chip">' + esc(get("ui.cat." + a.cat) || a.cat) + '</span>';
  if (a.dl) c += '<span class="chip"><bdi dir="ltr">' + a.dl + '</bdi> ' + esc(t("downloads")) + '</span>';
  return c;
}

function renderApps(){
  $("apps").innerHTML = APPS.map(function(a, i){
    return '<article class="app">' +
      '<div class="app-top" data-detail="' + i + '">' +
        '<img class="app-icon" src="' + img(a.icon,"s128") + '" alt="" width="64" height="64" loading="lazy">' +
        '<div class="app-meta"><h3 class="app-name">' + esc(appName(a)) + '</h3>' +
        '<p class="app-tag">' + esc(get("apps." + a.key + ".tag")) + '</p><div class="chips">' + chipsHtml(a) + '</div></div>' +
      '</div>' +
      '<div class="peek" data-detail="' + i + '" aria-hidden="true">' +
        a.shots.slice(0,4).map(function(s){ return '<img src="' + img(s,"h240") + '" alt="" loading="lazy">'; }).join("") +
      '</div>' +
      '<div class="actions">' +
        '<button class="btn btn-2" type="button" data-detail="' + i + '">' + ICON_INFO + esc(t("details")) + '</button>' +
        '<a class="btn btn-1" href="' + playUrl(a) + '" target="_blank" rel="noopener" aria-label="' + esc(appName(a) + " — " + t("open")) + '">' + ICON_PLAY + esc(t("openShort")) + '</a>' +
      '</div>' +
    '</article>';
  }).join("");
}

function renderWeb(){
  $("webs").innerHTML = PROJECTS.map(function(p){
    return '<a class="proj" href="' + p.href + '" target="_blank" rel="noopener">' +
      '<span class="ic" style="background:' + p.color + '">' + p.icon + '</span>' +
      '<span class="pc"><span class="nm">' + esc(get("web." + p.key + ".nm")) + '</span><span class="ds">' + esc(get("web." + p.key + ".ds")) + '</span></span>' +
      '<span class="arr" aria-hidden="true">↗</span></a>';
  }).join("");
}

function renderLangSelect(){
  $("lang").innerHTML = LANGS.map(function(l){
    return '<option value="' + l.code + '" lang="' + (l.html || l.code) + '"' + (l.code === lang ? " selected" : "") + '>' + l.name + '</option>';
  }).join("");
  $("lang").setAttribute("aria-label", t("langLabel"));
}

function renderAll(){
  renderStatic(); renderLangSelect(); renderApps(); renderWeb();
  if (current >= 0) fillSheet(current);
  document.documentElement.classList.remove("i18n-wait");
}

/* =====================================================================
   detail sheet
   ===================================================================== */
var sheet = $("sheet"), current = -1;

function fillSheet(i){
  var a = APPS[i], feats = get("apps." + a.key + ".feats") || [];
  sheet.innerHTML =
    '<div class="sh-grip" aria-hidden="true"></div>' +
    '<div class="sh-head" id="shHead">' +
      '<img class="app-icon" src="' + img(a.icon,"s128") + '" alt="" width="56" height="56">' +
      '<div><h3 id="sh-title">' + esc(appName(a)) + '</h3><div class="dev">Teemy</div><div class="chips">' + chipsHtml(a) + '</div></div>' +
      '<button class="x" type="button" id="shClose" aria-label="' + esc(t("close")) + '">' + ICON_X + '</button>' +
    '</div>' +
    '<div class="sh-body">' +
      '<p class="lead">' + esc(get("apps." + a.key + ".lead")) + '</p>' +
      '<div class="shots">' + a.shots.map(function(s, k){
        return '<button type="button" data-shot="' + k + '"><img src="' + img(s,"h760") + '" alt="' + esc(appName(a) + " " + (k+1)) + '" loading="lazy"></button>';
      }).join("") + '</div>' +
      '<h4>' + esc(t("highlights")) + '</h4>' +
      '<ul class="feats">' + feats.map(function(f, k){
        return '<li><span class="em" aria-hidden="true">' + (a.em[k] || "•") + '</span><span>' + esc(f) + '</span></li>';
      }).join("") + '</ul>' +
    '</div>' +
    '<div class="sh-foot"><a class="btn btn-1" href="' + playUrl(a) + '" target="_blank" rel="noopener">' + ICON_PLAY + esc(t("open")) + '</a></div>';
  $("shClose").onclick = function(){ sheet.close(); };
  sheet.onscroll = function(){ $("shHead").classList.toggle("stuck", sheet.scrollTop > 4); };
}

function openSheet(i, fromHash){
  current = i;
  fillSheet(i);
  if (!sheet.open) sheet.showModal();
  sheet.scrollTop = 0;
  document.body.style.overflow = "hidden";
  if (!fromHash && location.hash !== "#" + APPS[i].key) history.pushState({sheet:1}, "", "#" + APPS[i].key);
}
sheet.addEventListener("close", function(){
  current = -1;
  document.body.style.overflow = "";
  if (location.hash) {
    if (history.state && history.state.sheet) history.back();
    else history.replaceState(null, "", location.pathname + location.search);
  }
});
sheet.addEventListener("click", function(e){
  if (e.target === sheet) { sheet.close(); return; }   // backdrop tap
  var b = e.target.closest("[data-shot]");
  if (b) openLightbox(+b.getAttribute("data-shot"));
});
window.addEventListener("popstate", function(){
  if (lb.open) lb.close();
  var i = indexFromHash();
  if (i < 0 && sheet.open) sheet.close();
  else if (i >= 0 && !sheet.open) openSheet(i, true);
});
function indexFromHash(){
  var k = location.hash.replace("#","");
  for (var i=0;i<APPS.length;i++) if (APPS[i].key === k) return i;
  return -1;
}

document.addEventListener("click", function(e){
  var d = e.target.closest("[data-detail]");
  if (d) openSheet(+d.getAttribute("data-detail"));
});

/* =====================================================================
   lightbox
   ===================================================================== */
var lb = $("lb"), track = $("lbTrack");
function openLightbox(k){
  var a = APPS[current];
  track.innerHTML = a.shots.map(function(s, n){
    return '<figure><img src="' + img(s,"h1600") + '" alt="' + esc(appName(a) + " " + (n+1)) + '"></figure>';
  }).join("");
  lb.showModal();
  track.scrollLeft = k * track.clientWidth;
  updateCount();
}
function updateCount(){
  var n = APPS[current] ? APPS[current].shots.length : 0;
  var k = Math.round(track.scrollLeft / Math.max(1, track.clientWidth));
  $("lbCount").textContent = n ? (k+1) + " / " + n : "";
}
function step(d){ track.scrollBy({left: d * track.clientWidth, behavior:"smooth"}); }
track.addEventListener("scroll", updateCount, {passive:true});
$("lbClose").onclick = function(){ lb.close(); };
$("lbPrev").onclick = function(){ step(-1); };
$("lbNext").onclick = function(){ step(1); };
lb.addEventListener("click", function(e){ if (e.target.tagName === "FIGURE") lb.close(); });
lb.addEventListener("keydown", function(e){
  if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
  if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
});

/* =====================================================================
   boot
   ===================================================================== */
function setLang(code){
  return Promise.all([loadDict(DEFAULT_LANG), code === DEFAULT_LANG ? null : loadDict(code).catch(function(){ return null; })])
    .then(function(r){ lang = (code === DEFAULT_LANG || r[1]) ? code : DEFAULT_LANG; renderAll(); });
}
$("lang").addEventListener("change", function(){
  var code = this.value;
  try { localStorage.setItem(LS_KEY, code); } catch(e){}
  setLang(code);
});
/* never keep the page hidden for long, even on a slow network */
setTimeout(function(){ document.documentElement.classList.remove("i18n-wait"); }, 1500);
setLang(lang).then(function(){
  var startIdx = indexFromHash();
  if (startIdx >= 0) openSheet(startIdx, true);
});
